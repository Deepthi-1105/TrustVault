
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Documents | TrustVault</title>
</head>
<body>
    <h1>My TrustVault Documents</h1>

    <p th:if="${success}" th:text="${success}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <h2>Upload a Document</h2>

    <p>Allowed file types: PDF and TXT. Maximum size: 10 MB.</p>

    <form th:action="@{/documents/upload}"
          method="post"
          enctype="multipart/form-data">

        <label for="uploadTitle">Document title:</label>
        <input type="text"
               id="uploadTitle"
               name="title"
               required
               maxlength="100">
        <br><br>

        <label for="uploadDescription">Description:</label>
        <textarea id="uploadDescription"
                  name="description"
                  maxlength="500"></textarea>
        <br><br>

        <label for="file">Choose a PDF or TXT file:</label>
        <input type="file"
               id="file"
               name="file"
               accept=".pdf,.txt"
               required>
        <br><br>

        <button type="submit">Upload Document</button>
    </form>

    <hr>

    <h2>Create a document record without a file</h2>

    <form th:action="@{/documents}" method="post">
        <label for="recordTitle">Document title:</label>
        <input type="text"
               id="recordTitle"
               name="title"
               required
               maxlength="100">
        <br><br>

        <label for="recordDescription">Description:</label>
        <textarea id="recordDescription"
                  name="description"
                  maxlength="500"></textarea>
        <br><br>

        <button type="submit">Create Document Record</button>
    </form>

    <hr>

    <h2>My Documents</h2>

    <p th:if="${#lists.isEmpty(documents)}">
        You have no documents yet.
    </p>

    <ul>
        <li th:each="doc : ${documents}">
            <a th:if="${doc.fileName != null}"
   th:href="@{/documents/{id}/download(id=${doc.id})}">
    Download file
</a>
            <strong th:text="${doc.title}">Document title</strong>
            <span th:if="${doc.description != null}"
                  th:text="${doc.description}"></span>
            <span>
                (ID: <span th:text="${doc.id}"></span>)
            </span>
            <span th:if="${doc.fileName != null}">
                — File uploaded
            </span>
            <span th:if="${doc.fileName == null}">
                — Record only
            </span>
        </li>
    </ul>

    <p><a th:href="@{/}">Back to Home</a></p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log Out</button>
    </form>
</body>
</html>
